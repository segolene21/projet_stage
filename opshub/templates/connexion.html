<!-- Page de connexion au portail. -->
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechCommand Center — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page" style="background-image: url('{% static 'img/Image de fond/0adc9cb6c488fda3afd27e9fdc5196f4.jpg' %}');background-size:cover;">

  <div class="page-transition" id="transition"></div>

  <div class="login-card">
    <!-- GAUCHE -->
    <div class="left-side">
      <div class="monitor-text">
        <span class="line">MONITOR.</span>
        <span class="line">ASSIGN.</span>
        <span class="line resolve">RESOLVE.</span>
      </div>
      <div class="mtn-bottom">MTN Bénin — TechCommand Center Portal</div>
    </div>

    <!-- DROITE -->
    <form class="right-side" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-title">Get Started Now!!</div>
      <div class="form-subtitle">Please login to your account to continue...</div>

      <div class="form-group">
        <label class="form-label">User Name</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" id="username"/>
      </div>
      <div class="form-group">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label">Password</label>
  
        </div>
        <input type="password" name="password" class="form-control" placeholder="••••••••" id="password"/>
      </div>

      {% if form.errors %}
        <p style="color:red;font-size:12px;">Identifiants incorrects.</p>
      {% endif %}

      <button type="submit" class="btn-login" id="loginBtn">Log in</button>
    </form>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

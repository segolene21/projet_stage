{% extends 'base.html' %}

{% block content %}
    <div class="detail-card">
        <h1>{{ service.nom }}</h1>
        <p class="detail-description">{{ service.description }}</p>

        <h2 class="detail-subtitle">Outils qui surveillent ce service</h2>

        <ul class="detail-outils-list">
            {% for outil in service.outils_monitoring.all %}
                <li>
                    <a href="{% url 'detail_outil' outil.id %}">{{ outil.nom }}</a>
                </li>
            {% empty %}
                <li class="empty-state">Aucun outil rattaché pour l'instant</li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block content %}
    <h1>Liste des outils</h1>

    <input type="text" id="champ_recherche_outils" placeholder="Rechercher un outil...">

    {% if user.teamlead %}
        <button onclick="ouvrirModaleAjout()" data-url-ajout="{% url 'ajouter_outil' %}">Ajouter un outil</button>

        <div id="modale-ajout" style="display:none;">
            <form id="form-outil" data-url="{% url 'ajouter_outil' %}">
                {% csrf_token %}
                <input type="hidden" name="outil_id" id="champ-outil-id">
                <label>Nom : <input type="text" name="nom" id="champ-nom"></label><br>
                <label>Lien d'accès : <input type="url" name="lien_acces" id="champ-lien-acces"></label><br>
                <label>Authentification requise : <input type="checkbox" name="necessite_authentification" id="champ-auth"></label><br>
                <label>Statut actif : <input type="checkbox" name="statut" id="champ-statut" checked></label><br>
                <button type="submit">Enregistrer</button>
                <button type="button" onclick="document.getElementById('modale-ajout').style.display='none'">Annuler</button>
            </form>
            <p id="message-erreur" style="color:red;"></p>
        </div>
    {% endif %}

    <ul id="liste-outils">
        {% for outil in outils %}
            <li id="outil-{{ outil.id }}">
                <a id="nom-outil-{{ outil.id }}" href="{% url 'detail_outil' outil.id %}">{{ outil.nom }}</a>

                {% if user.teamlead %}
                    <button onclick="ouvrirModaleModification({{ outil.id }}, '{{ outil.nom }}', '{{ outil.lien_acces }}', {{ outil.necessite_authentification|yesno:'true,false' }}, {{ outil.statut|yesno:'true,false' }}, '{% url 'modifier_outil' outil.id %}')">
                        Modifier
                    </button>
                    <button onclick="supprimerOutil({{ outil.id }}, '{% url 'supprimer_outil' outil.id %}')">
                        Supprimer
                    </button>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/csrf.js' %}"></script>
    <script src="{% static 'js/outils.js' %}"></script>
{% endblock %}

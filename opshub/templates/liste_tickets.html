{% extends "base.html" %}
{% block content %}
<h1>Liste des tickets</h1>

<div class="barre-actions">
    {% if user.is_teamlead %}
    <button onclick="document.getElementById('modale-import').style.display='block'">Importer un ticket</button>
      {% endif %}
    <input type="text" id="recherche-import" placeholder="Rechercher un import par titre..." oninput="rechercherImports()" />
</div>

<div id="liste-imports">
    <!-- rempli dynamiquement : un bloc tableau par import -->
</div>

<!-- Modale Import -->
<div id="modale-import" class="modale" style="display:none;">
    <div class="modale-contenu">
        <h2>Importer des tickets</h2>
        <label>Titre de l'import</label>
        <input type="text" id="titre-import" placeholder="Ex: Tickets semaine 33" />
        <input type="file" id="fichier-ticket" accept=".xlsx" onchange="previsualiserTicket(this)" />
        <div id="apercu-ticket" style="display:none;">
            <h3>Aperçu — ajoutez un feedback si besoin</h3>
            <div id="tableau-ticket"></div>
        </div>
        <div class="modale-actions">
            <button id="btn-confirmer" onclick="confirmerImport()">Confirmer l'import</button>
            <button onclick="fermerModaleImport()">Annuler</button>
        </div>
    </div>
</div>

<!-- Modale Tableau complet d'un import -->
<div id="modale-tickets" class="modale" style="display:none;">
    <div class="modale-contenu modale-large">
        <div class="modale-header">
            <h2 id="titre-modale-tickets">Tickets</h2>
            <button onclick="fermerModaleTickets()">Fermer</button>
        </div>
        <div class="modale-actions-top">
            <button onclick="telechargerLotActuel('xlsx')">Télécharger en Excel</button>
            <button onclick="telechargerLotActuel('pdf')">Télécharger en PDF</button>
        </div>
        <input type="text" id="recherche-ticket-modale" placeholder="Rechercher dans cet import..." oninput="rechercherDansModale()" />
        <table id="tableau-tickets">
            <thead>
                <tr>
                    <th>ID</th><th>State</th><th>Requester</th><th>Details</th>
                    <th>Feedback</th><th>Modifié le</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="corps-tableau-tickets"></tbody>
        </table>
    </div>
</div>
{% endblock %}

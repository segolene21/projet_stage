<!-- Formulaire de creation d'une equipe d'outils. -->
{% extends 'base.html' %}

{% block content %}

<h1>Créer une nouvelle équipe outil</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Enregistrer
    </button>

    <a href="{% url 'liste_outils' %}">
        Annuler
    </a>
</form>

{% endblock %}
